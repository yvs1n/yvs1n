<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 30px;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .kicker-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #58a6ff;
        letter-spacing: 1.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #8b949e;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Frame Background (GitHub Surface Dark) -->
  <rect x="1" y="1" width="848" height="158" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <!-- Accent Indicator Line -->
  <rect x="28" y="28" width="3" height="42" rx="1.5" fill="#58a6ff" />

  <!-- Typography Block -->
  <g transform="translate(42, 28)">
    <!-- Small Overline -->
    <text x="0" y="10" class="kicker-text">COMPUTER ENGINEERING • UNIVERSITY OF SHARJAH</text>
    
    <!-- Full Name -->
    <text x="0" y="38" class="name-text">Yassin Mohamed Ragab</text>
  </g>

  <!-- Subtitle Line -->
  <g transform="translate(42, 92)">
    <text x="0" y="0" class="sub-text">Full-Stack Developer  •  Former Head Boy  •  Academic Mentor  •  Aspiring AI Engineer</text>
  </g>

  <!-- Clean Credential Badges Row (No Emojis, No Glows) -->
  <g transform="translate(42, 114)">
    <!-- Badge 1: Location -->
    <rect x="0" y="0" width="100" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" class="tag-text">Sharjah, UAE</text>

    <!-- Badge 2: Community Reach -->
    <rect x="108" y="0" width="155" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="185" y="15" text-anchor="middle" class="tag-text">500K+ Community Reach</text>

    <!-- Badge 3: Academic Honors -->
    <rect x="271" y="0" width="180" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="361" y="15" text-anchor="middle" class="tag-text">A* Math • 8 A*/A IGCSE</text>

    <!-- Badge 4: TA -->
    <rect x="459" y="0" width="145" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="531" y="15" text-anchor="middle" class="tag-text">Pearson Edexcel TA</text>

    <!-- Badge 5: Former Head Boy -->
    <rect x="612" y="0" width="140" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="682" y="15" text-anchor="middle" class="tag-text">Former Head Boy</text>
  </g>
</svg>
